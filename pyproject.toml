[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "face_grouping"
version = "0.1.0"
description = "Precision-first face grouping pipeline using MediaPipe and IR-SE50."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0.0",
  "mediapipe>=0.10.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "pyyaml>=6.0",
  "opencv-python>=4.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
