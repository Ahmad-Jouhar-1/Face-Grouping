[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "face_grouping"
version = "0.3.3"
description = "Precision-first face grouping pipeline using MediaPipe and IR-SE50."
requires-python = ">=3.10"

[project.scripts]
face-grouping-api = "face_grouping.api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
